<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sentinel AI</title>
<style>
:root{--bg:#0b1220;--card:#121b2e;--card2:#182339;--bd:#243250;--tx:#e8edf6;--mu:#8a98b3;--ac:#5b8cff;--hi:#ef5b5b;--md:#f2b544;--lo:#3ecf8e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fa;--card:#fff;--card2:#eef1f8;--bd:#dbe1ee;--tx:#14203a;--mu:#5f6d8a}}
:root[data-theme="dark"]{--bg:#0b1220}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}h1,h2,h3{margin:0}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:9px;font-weight:600;transition:.2s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.mu{color:var(--mu)}.sm{font-size:12px}
.app{display:flex;min-height:100vh}
nav{width:210px;padding:20px 12px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;flex:none}
.logo{font-weight:800;font-size:17px;padding:0 10px 18px;display:flex;gap:8px;align-items:center}.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--ac),#9b6bff);display:inline-block}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--mu);margin-bottom:2px}
nav button:hover{background:var(--card2)}nav button.on{background:var(--card2);color:var(--tx)}
main{flex:1;padding:26px 30px;min-width:0;max-width:1100px;animation:f .35s}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
.grid{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi b{font-size:28px;display:block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--lo)}.dot.high{background:var(--hi)}.dot.med{background:var(--md)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--bd);color:var(--mu);text-transform:capitalize}
.row{padding:11px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:flex-start;cursor:pointer}.row:last-child{border:0}.row:hover h4{color:var(--ac)}
h4{margin:0;font-size:14px}
.demo{background:#f2b54422;color:var(--md);border:1px solid #f2b54455;padding:2px 8px;border-radius:99px;font-size:11px}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px}.bars div.c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:1px}.bars span{width:100%;border-radius:3px;max-width:34px}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:20px}.tl .e{position:relative;padding-bottom:18px}.tl .e:before{content:"";position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}.tl .e.high:before{background:var(--hi)}.tl .e.low:before{background:var(--lo)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.tabs button{background:var(--card);border:1px solid var(--bd);padding:6px 13px;border-radius:99px;color:var(--mu)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chat{display:flex;flex-direction:column;gap:14px;margin:16px 0}.u{align-self:flex-end;background:var(--ac);color:#fff;padding:9px 14px;border-radius:14px 14px 3px 14px;max-width:80%}
.a{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px}.a h5{margin:12px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ac)}.a h5:first-child{margin-top:0}.a ul{margin:0;padding-left:18px}
.chip{display:inline-block;margin:3px 4px 0 0;padding:3px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);font-size:12px}.chip:hover{border-color:var(--ac)}
.sug{display:flex;gap:8px;flex-wrap:wrap}.sug button{background:var(--card);border:1px solid var(--bd);padding:7px 12px;border-radius:99px;font-size:13px}.sug button:hover{border-color:var(--ac)}
.inp{display:flex;gap:8px;margin-top:12px}.inp input{flex:1;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:11px 14px;border-radius:10px;font:inherit}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}#modal .card{max-width:520px;width:100%;max-height:80vh;overflow:auto}
.hero{max-width:900px;margin:0 auto;padding:80px 24px 40px;text-align:center}.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.08;letter-spacing:-.02em;background:linear-gradient(120deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);font-size:17px;max-width:660px;margin:18px auto 26px}
.prev{max-width:900px;margin:30px auto;padding:0 24px 60px;text-align:left}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:10px;border:0;border-bottom:1px solid var(--bd)}nav .logo{display:none}nav button{width:auto;white-space:nowrap}main{padding:18px 14px}}
</style></head><body><div id="root"></div><div id="modal" onclick="if(event.target===this)this.style.display='none'"><div class="card" id="mb"></div></div>
<script>
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
const CC={NovaAI:'#5b8cff',CloudForge:'#9b6bff',DataPilot:'#2fc4b2'};
const raw=[
['NovaAI','01-12','pricing','med','Pro plan launched at ₹999/mo','Initial public pricing recorded for NovaAI Pro.','—','₹999'],
['NovaAI','03-12','ai','high','AI Search launched','Semantic search added to the core product.','—','AI Search'],
['NovaAI','05-20','pricing','high','Price cut 20%','Pro plan price reduced on the public pricing page.','₹999','₹799'],
['NovaAI','07-08','product','high','Enterprise plan introduced','New Enterprise tier with SSO and audit logs.','—','Enterprise'],
['NovaAI','09-16','ai','high','AI Assistant launched','In-product assistant announced on the company blog.','—','AI Assistant'],
['NovaAI','09-22','pricing','med','Price cut 12.5%','Pro plan lowered again shortly after the assistant launch.','₹799','₹699'],
['CloudForge','02-05','product','med','Forge Pipelines launched','New workflow product added to the catalog.','—','Forge Pipelines'],
['CloudForge','04-14','partnership','high','Partnership announced','Integration partnership with a fictional cloud vendor (press release).','—','StratoCloud'],
['CloudForge','06-09','ai','high','AI analytics launched','AI-driven analytics dashboards released.','—','AI Analytics'],
['CloudForge','08-18','pricing','med','Pricing update','Standard plan reduced.','₹599','₹549'],
['DataPilot','01-20','expansion','high','Entered new market','Announced availability in Southeast Asia.','—','SEA market'],
['DataPilot','03-11','product','low','New integration','Connector added for a popular BI tool.','—','BI connector'],
['DataPilot','06-24','ai','high','AI recommendations launched','Recommendation engine added to the platform.','—','AI Recommendations'],
['DataPilot','08-27','product','high','Enterprise product launched','Enterprise edition released with new pricing page.','—','Enterprise edition']];
const E=raw.map((r,i)=>({id:i,c:r[0],d:new Date('2026-'+r[1]),cat:r[2],sig:r[3],t:r[4],desc:r[5],old:r[6],nw:r[7],src:`${r[0]} ${r[2]==='pricing'?'pricing page':r[2]==='partnership'?'press release':'blog'} — ${r[4]}`,url:`https://demo.sentinel.ai/${r[0].toLowerCase()}/${i+1}`})).sort((a,b)=>b.d-a.d);
const NOW=new Date('2026-09-29'),fd=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const ev=(c,f)=>E.filter(e=>(!c||e.c===c)&&(!f||f(e)));
const sigL={high:'High',med:'Medium',low:'Low'};
let S={v:'landing',comp:null,tab:'Timeline',flt:'all',chat:[]};
const $=id=>document.getElementById(id);
const dot=e=>`<span class="dot ${e.sig}"></span>`;
function evRow(e){return `<div class="row" onclick="ev_(${e.id})">${dot(e)}<div style="flex:1"><h4>${e.c}: ${e.t}</h4><div class="mu sm">${fd(e.d)} · ${sigL[e.sig]} significance${e.old!=='—'?` · ${e.old} → ${e.nw}`:''}</div></div><span class="tag">${e.cat}</span></div>`}
function ev_(id){const e=E[E.findIndex(x=>x.id==id)];$('mb').innerHTML=`<span class="demo">Demo data</span><h3 style="margin:10px 0 4px">${e.t}</h3><p class="mu">${e.c} · ${e.cat} · ${fd(e.d)}</p><p>${e.desc}</p>${e.old!=='—'?`<div class="grid two"><div class="card"><div class="mu sm">Before</div><b>${e.old}</b></div><div class="card"><div class="mu sm">After</div><b>${e.nw}</b></div></div>`:''}<p class="sm"><b>Why ${sigL[e.sig].toLowerCase()}?</b> ${e.sig==='high'?'Launches, market entries, partnerships and large price moves change competitive positioning.':e.sig==='med'?'Incremental product or price change; worth tracking.':'Minor change with limited market impact.'} This is a heuristic classification, not a certainty.</p><p class="sm mu">Source: ${e.src}<br><a style="color:var(--ac)" href="#" onclick="return false">${e.url}</a> (fictional demo URL)</p><button class="btn g" onclick="$('modal').style.display='none'">Close</button>`;$('modal').style.display='flex'}
function evList(ids){return ids.map(id=>{const e=E.find(x=>x.id===id);return `<span class="chip" style="cursor:pointer" onclick="ev_(${id})">📎 ${e.c} · ${M[e.d.getMonth()]} ${e.d.getDate()} · ${e.cat}</span>`}).join('')}
function go(v,c){S.v=v;if(c!==undefined){S.comp=c;S.tab='Timeline'}render();scrollTo(0,0)}
function render(){const r=$('root');if(S.v==='landing'){r.innerHTML=landing();return}
const nav=[['overview','Overview'],['competitors','Competitors'],['trends','Market Trends'],['alerts','Alerts'],['ask','Ask AI']];
r.innerHTML=`<div class="app"><nav><div class="logo"><i></i>Sentinel AI</div>${nav.map(n=>`<button class="${S.v===n[0]||(S.v==='comp'&&n[0]==='competitors')?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<button onclick="go('landing')" style="margin-top:16px">← Home</button></nav><main>${({overview,competitors,comp:profile,trends,alerts,ask:askView})[S.v]()}</main></div>`;
if(S.v==='ask')bindAsk()}
function landing(){return `<div class="hero"><span class="demo">Prototype · fictional demo data</span><h1 style="margin-top:18px">Know What Your Competitors Are Doing — Before It Matters.</h1><p>Sentinel AI continuously monitors the competitive landscape, remembers historical changes, and turns public signals into evidence-backed intelligence.</p><button class="btn" onclick="go('overview')">Start Monitoring</button> <button class="btn g" onclick="go('ask')">View Demo</button></div>
<div class="prev"><div class="card"><div class="grid two"><div><h4 class="mu sm" style="margin-bottom:8px">DETECTED CHANGE</h4>${evRow(E[0])}<h4 class="mu sm" style="margin:14px 0 6px">AI INSIGHT</h4><div class="card" style="background:var(--card2)">NovaAI shows an observed pattern of repeated price reductions alongside AI launches. <span class="chip">📎 3 evidence items</span></div></div><div><h4 class="mu sm" style="margin-bottom:8px">AI LAUNCHES BY MONTH</h4>${chart(ev(0,e=>e.cat==='ai'))}<p class="sm mu">Persistent memory: every observation is kept, not overwritten.</p></div></div></div></div>`}
function chart(list){const mx=Math.max(1,...M.map((m,i)=>list.filter(e=>e.d.getMonth()===i).length));return `<div class="bars">${M.map((m,i)=>`<div class="c">${Object.keys(CC).map(c=>{const n=list.filter(e=>e.d.getMonth()===i&&e.c===c).length;return n?`<span style="height:${n/mx*100}px;background:${CC[c]}"></span>`:''}).join('')}<span class="mu sm" style="background:none;height:auto;text-align:center">${m}</span></div>`).join('')}</div><div class="sm mu" style="margin-top:8px">${Object.keys(CC).map(c=>`<span style="color:${CC[c]}">●</span> ${c}`).join(' &nbsp; ')}</div>`}
function overview(){const rec=ev(0,e=>NOW-e.d<62*864e5),hi=E.filter(e=>e.sig==='high').length;
return `<h1>Competitive Intelligence</h1><p class="mu">Your AI memory of the competitive landscape. <span class="demo">Demo data</span></p><div class="grid k" style="margin:18px 0">${[['Competitors monitored',3],['Changes detected',E.length],['High-impact changes',hi],['Active alerts',rec.filter(e=>e.sig==='high').length]].map(k=>`<div class="card kpi"><span class="mu sm">${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>
<div class="grid two"><div class="card"><h3>Recent changes</h3>${E.slice(0,5).map(evRow).join('')}</div><div class="card"><h3 style="margin-bottom:10px">Competitive activity</h3>${chart(E)}<h3 style="margin:18px 0 6px">Market trends</h3><ul style="margin:0;padding-left:18px"><li>Observed: AI features appear across all 3 monitored competitors.</li><li>3 competitors changed pricing in the last 6 months.</li></ul></div></div>
<div class="card" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>Try the memory-aware analyst: <i class="mu">"Has NovaAI changed pricing before?"</i></span><button class="btn" onclick="go('ask')">Ask AI</button></div>`}
function competitors(){return `<h1>Competitors</h1><p class="mu">Monitored competitors (fictional demo companies).</p><div class="grid two" style="margin-top:16px">${Object.keys(CC).map(c=>{const l=ev(c);return `<div class="card row" style="display:block" onclick="go('comp','${c}')"><div style="display:flex;gap:10px;align-items:center"><div style="width:38px;height:38px;border-radius:10px;background:${CC[c]};display:grid;place-items:center;font-weight:800;color:#fff">${c[0]}</div><div><h3>${c}</h3><span class="mu sm">Monitoring: active · ${l.length} observations</span></div></div><p class="sm mu">Latest: ${l[0].t} (${fd(l[0].d)})</p></div>`}).join('')}</div>
<h3 style="margin:24px 0 10px">Comparison</h3><div class="card scroll"><table><tr><th>Metric</th>${Object.keys(CC).map(c=>`<th>${c}</th>`)}</tr>${[['Latest recorded price',c=>({NovaAI:'₹699',CloudForge:'₹549',DataPilot:'No price recorded'})[c]],['AI launches',c=>ev(c,e=>e.cat==='ai').length],['Price changes',c=>ev(c,e=>e.cat==='pricing').length],['High-impact events',c=>ev(c,e=>e.sig==='high').length],['Total events',c=>ev(c).length]].map(r=>`<tr><td class="mu">${r[0]}</td>${Object.keys(CC).map(c=>`<td>${r[1](c)}</td>`).join('')}</tr>`).join('')}</table></div>`}
function profile(){const c=S.comp,tabs=['Timeline','Pricing','AI Activity','Memory'];let b='';
if(S.tab==='Timeline'){const cats=['all','pricing','product','ai','partnership','expansion'];b=`<div class="sm mu">Filter:</div><div class="tabs" style="margin-top:6px">${cats.map(x=>`<button class="${S.flt===x?'on':''}" onclick="S.flt='${x}';render()">${x}</button>`).join('')}</div><div class="tl">${ev(c,e=>S.flt==='all'||e.cat===S.flt).map(e=>`<div class="e ${e.sig}" onclick="ev_(${e.id})" style="cursor:pointer"><div class="mu sm">${fd(e.d)}</div><h4>${e.t}</h4><div class="mu sm">${e.desc}</div></div>`).join('')||'<p class="mu">No events in this category.</p>'}</div>`}
if(S.tab==='Pricing'){const p=ev(c,e=>e.cat==='pricing').reverse();b=p.length?`<div class="card"><h3 style="margin-bottom:10px">Pricing history</h3>${p.map(e=>`<div class="row" onclick="ev_(${e.id})"><div style="width:70px" class="mu">${fd(e.d).slice(0,-5)}</div><div style="flex:1"><b>${e.old} → ${e.nw}</b>${e.old!=='—'&&+e.old.replace(/\D/g,'')?` <span class="tag">${Math.round((+e.nw.replace(/\D/g,'')/+e.old.replace(/\D/g,'')-1)*100)}%</span>`:''}</div></div>`).join('')}</div>`:`<div class="card">No previous verified snapshot available. No pricing observations recorded for ${c}.</div>`}
if(S.tab==='AI Activity'){b=`<div class="tl">${ev(c,e=>e.cat==='ai').map(e=>`<div class="e" onclick="ev_(${e.id})" style="cursor:pointer"><div class="mu sm">${fd(e.d)}</div><h4>${e.t}</h4></div>`).join('')}</div>`}
if(S.tab==='Memory'){const g=k=>ev(c,e=>e.cat===k).reverse().map(e=>M[e.d.getMonth()]+' → '+(e.nw)).join('<br>')||'<span class="mu">No records</span>';b=`<div class="grid two">${[['Pricing history','pricing'],['Product history','product'],['AI activity','ai'],['Partnerships & expansion','partnership']].map(m=>`<div class="card"><h4 class="mu sm">${m[0].toUpperCase()}</h4>${m[1]==='partnership'?[...ev(c,e=>e.cat==='partnership'),...ev(c,e=>e.cat==='expansion')].map(e=>M[e.d.getMonth()]+' → '+e.nw).join('<br>')||'<span class="mu">No records</span>':g(m[1])}</div>`).join('')}</div><p class="sm mu">Old values are preserved, never replaced.</p>`}
return `<a class="mu" href="#" onclick="go('competitors');return false">← Competitors</a><div style="display:flex;gap:12px;align-items:center;margin-top:10px"><div style="width:46px;height:46px;border-radius:12px;background:${CC[c]};display:grid;place-items:center;font-weight:800;color:#fff">${c[0]}</div><div><h1>${c}</h1><span class="mu sm">Monitoring active</span> <span class="demo">Demo competitor</span></div></div><div class="tabs">${tabs.map(t=>`<button class="${S.tab===t?'on':''}" onclick="S.tab='${t}';render()">${t}</button>`).join('')}</div>${b}<button class="btn" style="margin-top:18px" onclick="ask('What has ${c} been focusing on?')">Analyze ${c} strategy</button>`}
function trends(){const ai=ev(0,e=>e.cat==='ai').reverse(),pr=ev(0,e=>e.cat==='pricing').reverse();return `<h1>Market Trends</h1><p class="mu">Observed patterns based on monitored public activity — not predictions.</p>
<div class="card" style="margin:16px 0"><span class="tag">Emerging pattern</span><h3 style="margin:8px 0">AI-powered functionality is appearing across all 3 monitored competitors</h3>${ai.map(e=>`<div class="row" onclick="ev_(${e.id})">${dot(e)}<div><b>${e.c}</b> · ${e.t}<div class="mu sm">${fd(e.d)}</div></div></div>`).join('')}</div>
<div class="card"><span class="tag">Observed trend</span><h3 style="margin:8px 0">Pricing pressure: ${pr.length} price events across ${new Set(pr.map(e=>e.c)).size} competitors</h3>${pr.map(e=>`<div class="row" onclick="ev_(${e.id})">${dot(e)}<div><b>${e.c}</b> · ${e.old} → ${e.nw}<div class="mu sm">${fd(e.d)}</div></div></div>`).join('')}</div>`}
let readSet=new Set();
function alerts(){return `<h1>Alerts</h1><p class="mu">High and medium significance events.</p><div class="card" style="margin-top:14px">${E.filter(e=>e.sig!=='low').slice(0,8).map(e=>`<div class="row" style="opacity:${readSet.has(e.id)?.5:1}">${dot(e)}<div style="flex:1" onclick="ev_(${e.id})"><h4>${e.sig==='high'?'🚨 HIGH IMPACT':'⚡ CHANGE'} · ${e.c}: ${e.t}</h4><div class="mu sm">${fd(e.d)} · ${e.cat}</div></div><button class="tag" onclick="readSet.add(${e.id});render()">${readSet.has(e.id)?'Read':'Mark read'}</button></div>`).join('')}</div>`}
function ask(q){S.v='ask';S.pending=q;render();scrollTo(0,0)}
function askView(){return `<h1>Ask Competitive AI</h1><p class="mu">Ask questions about your competitive landscape. Answers are retrieved from stored memory, never from general knowledge.</p><div class="sug" style="margin-top:14px">${['What changed recently?','Has NovaAI changed pricing before?','What has NovaAI been focusing on?','What trends are appearing across all competitors?'].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div><div class="chat" id="chat">${S.chat.map(m=>m.r==='u'?`<div class="u">${m.t}</div>`:`<div class="a">${m.t}</div>`).join('')}</div><div class="inp"><input id="q" placeholder="e.g. Has CloudForge entered a new market?"><button class="btn" id="go">Ask</button></div>`}
function bindAsk(){const q=$('q'),send=t=>{if(!t.trim())return;S.chat.push({r:'u',t:t.replace(/</g,'&lt;')});S.chat.push({r:'a',t:answer(t)});render();$('q').focus();scrollTo(0,document.body.scrollHeight)};$('go').onclick=()=>send(q.value);q.onkeydown=e=>{if(e.key==='Enter')send(q.value)};if(S.pending){const p=S.pending;S.pending=null;send(p)}}
function answer(q){const l=q.toLowerCase(),c=Object.keys(CC).find(k=>l.replace(/\s/g,'').includes(k.toLowerCase()));
const sec=(h,b)=>`<h5>${h}</h5>${b}`,li=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const fmt=e=>`${fd(e.d)}: ${e.t}${e.old!=='—'?` (${e.old} → ${e.nw})`:''}`;
let list,ans,why,ctx,conf='Medium',next;
if(/pric|cost|cheap/.test(l)){list=ev(c,e=>e.cat==='pricing');if(!list.length)return sec('Answer','No previous verified snapshot available for that competitor.');const n=list.length;ans=`Yes. ${c||'Monitored competitors'} ${c?`has ${n} recorded pricing events`:'have '+n+' recorded pricing events'} in the last 9 months.`;ctx=li([...list].reverse().map(fmt));why=`Repeated reductions suggest an observed pattern of price competition. Public activity alone doesn't reveal motive.`;conf=n>1?'High':'Medium';next='Check whether pricing changes coincide with feature launches or plan restructuring.'}
